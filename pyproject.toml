[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zoho-analytics-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain-core>=0.3,<1",
    "langgraph>=0.6,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3,<1"]
azure = ["langchain-openai>=0.3,<1"]
gemini = ["langchain-google-genai>=2.1,<3"]
anthropic = ["langchain-anthropic>=0.3,<1"]
ollama = ["langchain-ollama>=0.3,<1"]
all-models = [
    "langchain-openai>=0.3,<1",
    "langchain-google-genai>=2.1,<3",
    "langchain-anthropic>=0.3,<1",
    "langchain-ollama>=0.3,<1",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<1",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]